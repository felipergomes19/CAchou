server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never


spring:
  application:
    name: ca-achou

  datasource:
    url: jdbc:postgresql://db.yahbgavtciohgncpssbk.supabase.co:5432/postgres
    username: ${ACHOU_DB_USER:postgres}
    password: ${ACHOU_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ACHOU_DB_POOL_SIZE:5}
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  mail:
    host: ${ACHOU_MAIL_HOST:smtp.gmail.com}
    port: ${ACHOU_MAIL_PORT:587}
    username: ${ACHOU_MAIL_USER:}
    password: ${ACHOU_MAIL_PASSWORD}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": ${ACHOU_MAIL_STARTTLS:true}
      "mail.smtp.ssl.enable": ${ACHOU_MAIL_SSL:false}
      "mail.smtp.connectiontimeout": 8000
      "mail.smtp.timeout": 8000
      "mail.smtp.writetimeout": 8000



achou:
  jwt:
    secret: ${ACHOU_JWT_SECRET:dev-only-troque-este-segredo-em-producao-0123456789}
    expiracao-horas: 12
  uploads:
    tamanho-maximo-bytes: 5242880
  mail:
    enabled: ${ACHOU_MAIL_ENABLED:false}
    # Deve ser um remetente autorizado no provedor SMTP (no Gmail, o próprio endereço da conta).
    from: ${ACHOU_MAIL_FROM:no-reply@achou.local}
  recuperacao:
    validade-minutos: 15
    max-tentativas: 5
    intervalo-segundos: 60
  # Lista exibida na tela de cadastro.
  cursos:
    - Administração
    - Desenvolvimento de Sistemas
    - Nutrição
    - Contabilidade
    - Marketing
    - Gastronomia
    - Guia de Turismo
    - Serviços Públicos
    - Eventos
    - Finanças
